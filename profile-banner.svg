
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1280"
     height="850"
     viewBox="0 0 1280 850"
     fill="none">

  <title>SaqlainHub | Full-Stack Software Engineer and AI Engineer</title>
  <desc>
    Minimal dark navy profile banner with a centered identity and a
    connected engineering workflow covering UI/UX, frontend, backend,
    data, AI, and production.
  </desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="850"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#071321"/>
      <stop offset=".55" stop-color="#0B192B"/>
      <stop offset="1" stop-color="#10182B"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8BE3FF"/>
      <stop offset="1" stop-color="#4599F7"/>
    </linearGradient>

    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C6B6FF"/>
      <stop offset="1" stop-color="#8174F9"/>
    </linearGradient>

    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D5F78B"/>
      <stop offset="1" stop-color="#85DDAA"/>
    </linearGradient>

    <linearGradient id="workflowLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#65D5FF" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#65D5FF"/>
      <stop offset="1" stop-color="#B2F18C" stop-opacity=".45"/>
    </linearGradient>

    <radialGradient id="topGlow">
      <stop stop-color="#338EDB" stop-opacity=".30"/>
      <stop offset="1" stop-color="#338EDB" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetGlow">
      <stop stop-color="#8273FF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#8273FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="limeGlow">
      <stop stop-color="#B8ED8B" stop-opacity=".14"/>
      <stop offset="1" stop-color="#B8ED8B" stop-opacity="0"/>
    </radialGradient>

    <pattern id="subtleGrid" width="36" height="36"
             patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36"
            stroke="#9CBDE0" stroke-opacity=".045"/>
    </pattern>

    <filter id="blur">
      <feGaussianBlur stdDeviation="32"/>
    </filter>

    <style>
      .font {
        font-family: Arial, Helvetica, sans-serif;
      }

      .muted {
        fill: #91A7C2;
        font-family: Arial, Helvetica, sans-serif;
      }

      .stage {
        fill: #F0F6FF;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 17px;
        font-weight: 700;
      }

      .detail {
        fill: #A7BAD2;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
      }

      .small {
        fill: #8EA7C5;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.7px;
      }

      .tech {
        fill: #DCEBFA;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
        font-weight: 600;
      }

      .node {
        fill: #0D1D30;
        stroke: #2A415D;
        stroke-width: 1;
      }

      .chip {
        fill: #142940;
        stroke: #2C4C69;
        stroke-width: 1;
      }
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1280" height="850" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="850" rx="22" fill="url(#subtleGrid)"/>

  <!-- Soft, restrained ambient light -->
  <ellipse cx="90" cy="70" rx="300" ry="210"
           fill="url(#topGlow)" filter="url(#blur)"/>
  <ellipse cx="1170" cy="160" rx="240" ry="190"
           fill="url(#violetGlow)" filter="url(#blur)"/>
  <ellipse cx="1110" cy="740" rx="240" ry="160"
           fill="url(#limeGlow)" filter="url(#blur)"/>

  <rect x=".75" y=".75" width="1278.5" height="848.5"
        rx="21.25" stroke="#3A536F" stroke-opacity=".65"/>

  <!-- TOP LEFT BRAND -->
  <g id="brand">
    <rect x="44" y="34" width="42" height="42" rx="12"
          fill="#112A43" stroke="#3E7095"/>

    <path d="M55 45H75V50H61V54H72V59H61V65H55Z"
          fill="url(#blue)"/>
    <path d="M67 59H76V65H67Z" fill="url(#lime)"/>

    <text x="98" y="51" class="font"
          font-size="17" font-weight="700" letter-spacing=".5"
          fill="#F2F7FF">SaqlainHub</text>

    <text x="98" y="69" class="font"
          font-size="10" font-weight="600" letter-spacing="2"
          fill="#83A7CC">ENGINEERING / AI</text>

    <text x="1235" y="53" text-anchor="end" class="small">
      PERSONAL ENGINEERING PROFILE
    </text>

    <circle cx="1217" cy="69" r="3" fill="#B7EF8A"/>
    <text x="1206" y="73" text-anchor="end" class="muted"
          font-size="11">Build · Integrate · Improve</text>
  </g>

  <line x1="44" y1="101" x2="1236" y2="101"
        stroke="#31465F" stroke-opacity=".8"/>

  <!-- CENTERED IDENTITY -->
  <g id="identity">
    <text x="640" y="145" text-anchor="middle" class="small">
      SOFTWARE ENGINEERING &amp; INTELLIGENT SYSTEMS
    </text>

    <text x="640" y="207" text-anchor="middle" class="font"
          font-size="48" font-weight="700" letter-spacing="-1.4"
          fill="#F3F7FF">Saqlain Ahmad</text>

    <text x="640" y="248" text-anchor="middle" class="font"
          font-size="23" font-weight="600">
      <tspan fill="#8BE3FF">Full-Stack Software Engineer</tspan>
      <tspan fill="#6D829D">  &amp;  </tspan>
      <tspan fill="#C4B5FD">AI Engineer</tspan>
    </text>

    <text x="640" y="285" text-anchor="middle" class="font"
          font-size="15" fill="#A9BCD3">
      Building thoughtful digital experiences and turning AI capabilities
    </text>
    <text x="640" y="307" text-anchor="middle" class="font"
          font-size="15" fill="#A9BCD3">
      into useful, connected software.
    </text>

    <!-- Small accent under identity -->
    <rect x="582" y="329" width="116" height="3" rx="1.5"
          fill="url(#blue)"/>
    <rect x="704" y="329" width="32" height="3" rx="1.5"
          fill="url(#violet)"/>
    <rect x="742" y="329" width="20" height="3" rx="1.5"
          fill="url(#lime)"/>
  </g>

  <!-- WORKFLOW INTRO -->
  <g id="workflow-heading">
    <text x="64" y="385" class="small">ENGINEERING WORKFLOW</text>

    <text x="64" y="414" class="font"
          font-size="23" font-weight="700"
          fill="#EDF5FF">From interface to production</text>

    <text x="1216" y="405" text-anchor="end" class="muted"
          font-size="12">DESIGN  →  BUILD  →  INTELLIGENCE  →  SHIP</text>
  </g>

  <!-- WORKFLOW CONNECTORS -->
  <g id="workflow-connectors">
    <path d="M251 520H270
             M456 520H475
             M661 520H680
             M866 520H885
             M1071 520H1090"
          stroke="url(#workflowLine)" stroke-width="2"
          stroke-linecap="round"/>

    <path d="M264 515L270 520L264 525
             M469 515L475 520L469 525
             M674 515L680 520L674 525
             M879 515L885 520L879 525
             M1084 515L1090 520L1084 525"
          stroke="#83DFFF" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="260" cy="520" r="3" fill="#72D8FF"/>
    <circle cx="465" cy="520" r="3" fill="#72D8FF"/>
    <circle cx="670" cy="520" r="3" fill="#AFA2FF"/>
    <circle cx="875" cy="520" r="3" fill="#AFA2FF"/>
    <circle cx="1080" cy="520" r="3" fill="#B7EF8A"/>
  </g>

  <!-- STAGE 1: UI/UX -->
  <g id="ui-ux">
    <rect x="64" y="444" width="187" height="154" rx="14"
          class="node"/>
    <rect x="64" y="444" width="187" height="3" rx="1.5"
          fill="url(#blue)"/>

    <!-- Wireframe icon -->
    <rect x="82" y="463" width="34" height="29" rx="5"
          fill="#142F48" stroke="#4A8DB5"/>
    <rect x="88" y="469" width="22" height="4" rx="2"
          fill="#8BE3FF"/>
    <rect x="88" y="477" width="13" height="3" rx="1.5"
          fill="#6B91B6"/>
    <rect x="88" y="484" width="18" height="3" rx="1.5"
          fill="#6B91B6"/>

    <text x="82" y="517" class="stage">UI / UX</text>
    <text x="82" y="539" class="detail">Experience &amp; design</text>

    <line x1="82" y1="552" x2="233" y2="552"
          stroke="#2B4058"/>

    <text x="82" y="571" class="tech">Figma · Layout</text>
    <text x="82" y="587" class="detail">User flows · Responsive UI</text>
  </g>

  <!-- STAGE 2: FRONTEND -->
  <g id="frontend">
    <rect x="269" y="444" width="187" height="154" rx="14"
          class="node"/>
    <rect x="269" y="444" width="187" height="3" rx="1.5"
          fill="#58CFFF"/>

    <!-- Code window icon -->
    <rect x="287" y="463" width="34" height="29" rx="5"
          fill="#142F48" stroke="#4A8DB5"/>
    <path d="M298 472L293 477L298 482
             M310 472L315 477L310 482"
          stroke="#8BE3FF" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"/>

    <text x="287" y="517" class="stage">Frontend</text>
    <text x="287" y="539" class="detail">Interfaces &amp; interaction</text>

    <line x1="287" y1="552" x2="438" y2="552"
          stroke="#2B4058"/>

    <text x="287" y="571" class="tech">React · Next.js</text>
    <text x="287" y="587" class="detail">TypeScript · Tailwind CSS</text>
  </g>

  <!-- STAGE 3: BACKEND -->
  <g id="backend">
    <rect x="474" y="444" width="187" height="154" rx="14"
          class="node"/>
    <rect x="474" y="444" width="187" height="3" rx="1.5"
          fill="url(#violet)"/>

    <!-- API/service icon -->
    <rect x="492" y="463" width="34" height="29" rx="5"
          fill="#262348" stroke="#665AA5"/>
    <path d="M500 472H518M500 477H518M500 482H512"
          stroke="#C4B5FD" stroke-width="1.7"
          stroke-linecap="round"/>

    <text x="492" y="517" class="stage">Backend</text>
    <text x="492" y="539" class="detail">Business logic &amp; APIs</text>

    <line x1="492" y1="552" x2="643" y2="552"
          stroke="#2B4058"/>

    <text x="492" y="571" class="tech">Python · FastAPI</text>
    <text x="492" y="587" class="detail">Auth · REST APIs · Tool calls</text>
  </g>

  <!-- STAGE 4: DATA -->
  <g id="data-layer">
    <rect x="679" y="444" width="187" height="154" rx="14"
          class="node"/>
    <rect x="679" y="444" width="187" height="3" rx="1.5"
          fill="#58D7C7"/>

    <!-- Database icon -->
    <ellipse cx="714" cy="469" rx="13" ry="5"
             fill="#173B3B" stroke="#73E4D3" stroke-width="1.5"/>
    <path d="M701 469V486C701 492 727 492 727 486V469
             M701 477C701 483 727 483 727 477"
          stroke="#73E4D3" stroke-width="1.5"/>

    <text x="697" y="517" class="stage">Data Layer</text>
    <text x="697" y="539" class="detail">Storage &amp; retrieval</text>

    <line x1="697" y1="552" x2="848" y2="552"
          stroke="#2B4058"/>

    <text x="697" y="571" class="tech">PostgreSQL · Neon</text>
    <text x="697" y="587" class="detail">SQLAlchemy · Prisma · Vectors</text>
  </g>

  <!-- STAGE 5: AI -->
  <g id="ai-layer">
    <rect x="884" y="444" width="187" height="154" rx="14"
          class="node"/>
    <rect x="884" y="444" width="187" height="3" rx="1.5"
          fill="url(#violet)"/>

    <!-- Neural/AI icon -->
    <circle cx="919" cy="477" r="12"
            fill="#252044" stroke="#BBAAFF" stroke-width="1.4"/>
    <circle cx="919" cy="477" r="4" fill="#C7B9FF"/>
    <circle cx="907" cy="467" r="2.5" fill="#C7B9FF"/>
    <circle cx="931" cy="467" r="2.5" fill="#C7B9FF"/>
    <circle cx="907" cy="487" r="2.5" fill="#C7B9FF"/>
    <circle cx="931" cy="487" r="2.5" fill="#C7B9FF"/>
    <path d="M909 469L915 474M929 469L923 474
             M909 485L915 480M929 485L923 480"
          stroke="#C7B9FF" stroke-width="1.2"/>

    <text x="902" y="517" class="stage">AI Layer</text>
    <text x="902" y="539" class="detail">Context-aware intelligence</text>

    <line x1="902" y1="552" x2="1053" y2="552"
          stroke="#2B4058"/>

    <text x="902" y="571" class="tech">Gemini · LLM APIs</text>
    <text x="902" y="587" class="detail">RAG · Embeddings · Agents</text>
  </g>

  <!-- STAGE 6: PRODUCTION -->
  <g id="production">
    <rect x="1089" y="444" width="127" height="154" rx="14"
          fill="#101F2C" stroke="#47654F" stroke-width="1"/>
    <rect x="1089" y="444" width="127" height="3" rx="1.5"
          fill="url(#lime)"/>

    <!-- Deployment icon -->
    <rect x="1107" y="463" width="32" height="29" rx="5"
          fill="#1A342F" stroke="#62895D"/>
    <path d="M1114 483L1120 477L1125 481L1133 471"
          stroke="#D5F78B" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1133" cy="471" r="2" fill="#D5F78B"/>

    <text x="1107" y="517" class="stage">Production</text>
    <text x="1107" y="539" class="detail">Ship &amp; maintain</text>

    <line x1="1107" y1="552" x2="1198" y2="552"
          stroke="#344A42"/>

    <text x="1107" y="571" class="tech">Git · GitHub</text>
    <text x="1107" y="587" class="detail">Deploy · Monitor</text>
  </g>

  <!-- WORKFLOW PRINCIPLE -->
  <g id="workflow-principle">
    <rect x="64" y="626" width="1152" height="83" rx="14"
          fill="#0C1B2C" stroke="#2A4058"/>

    <rect x="64" y="626" width="3" height="83" rx="1.5"
          fill="url(#blue)"/>

    <text x="88" y="652" class="small">THE ENGINEERING PRINCIPLE</text>

    <text x="88" y="680" class="font"
          font-size="17" font-weight="600" fill="#EAF3FF">
      Design with intent.
      <tspan fill="#7089A6">  </tspan>
      <tspan fill="#8BE3FF">Build end to end.</tspan>
      <tspan fill="#7089A6">  </tspan>
      <tspan fill="#C4B5FD">Integrate intelligence.</tspan>
      <tspan fill="#7089A6">  </tspan>
      <tspan fill="#BFEF91">Deliver value.</tspan>
    </text>
  </g>

  <!-- TECHNOLOGY SUMMARY -->
  <g id="technology-summary">
    <text x="64" y="753" class="small">CORE TOOLKIT</text>

    <g transform="translate(190 733)">
      <rect width="116" height="31" rx="8" class="chip"/>
      <text x="58" y="20" text-anchor="middle" class="tech">TypeScript</text>
    </g>

    <g transform="translate(316 733)">
      <rect width="104" height="31" rx="8" class="chip"/>
      <text x="52" y="20" text-anchor="middle" class="tech">Next.js</text>
    </g>

    <g transform="translate(430 733)">
      <rect width="91" height="31" rx="8" class="chip"/>
      <text x="45.5" y="20" text-anchor="middle" class="tech">Python</text>
    </g>

    <g transform="translate(531 733)">
      <rect width="112" height="31" rx="8" class="chip"/>
      <text x="56" y="20" text-anchor="middle" class="tech">FastAPI</text>
    </g>

    <g transform="translate(653 733)">
      <rect width="128" height="31" rx="8" class="chip"/>
      <text x="64" y="20" text-anchor="middle" class="tech">PostgreSQL</text>
    </g>

    <g transform="translate(791 733)">
      <rect width="77" height="31" rx="8" class="chip"/>
      <text x="38.5" y="20" text-anchor="middle" class="tech">RAG</text>
    </g>

    <g transform="translate(878 733)">
      <rect width="112" height="31" rx="8" class="chip"/>
      <text x="56" y="20" text-anchor="middle" class="tech">LLM APIs</text>
    </g>

    <g transform="translate(1000 733)">
      <rect width="111" height="31" rx="8" class="chip"/>
      <text x="55.5" y="20" text-anchor="middle" class="tech">GitHub</text>
    </g>

    <g transform="translate(1121 733)">
      <rect width="95" height="31" rx="8"
            fill="#1D302B" stroke="#47654F"/>
      <text x="47.5" y="20" text-anchor="middle"
            class="tech" fill="#D5F78B">Deploy</text>
    </g>
  </g>

  <!-- FOOTER -->
  <line x1="64" y1="789" x2="1216" y2="789"
        stroke="#2D4057"/>

  <text x="64" y="815" class="font"
        font-size="11" fill="#8198B5">SAQLAINHUB</text>

  <text x="640" y="815" text-anchor="middle" class="font"
        font-size="11" fill="#8198B5">
    SOFTWARE ENGINEERING  ×  AI ENGINEERING
  </text>

  <text x="1216" y="815" text-anchor="end" class="font"
        font-size="11" fill="#8198B5">BUILDING WITH PURPOSE</text>

</svg>
