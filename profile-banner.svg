
<svg xmlns="http://www.w3.org/2000/svg"
     width="1280"
     height="580"
     viewBox="0 0 1280 580"
     fill="none">

  <title>SaqlainHub | Full-Stack Software Engineer and AI Engineer</title>
  <desc>Saqlain Ahmad's engineering profile, showcasing full-stack development, data systems, AI engineering, and production deployment.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071321"/>
      <stop offset=".55" stop-color="#0B192B"/>
      <stop offset="1" stop-color="#10182B"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8BE3FF"/>
      <stop offset="1" stop-color="#4599F7"/>
    </linearGradient>

    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C6B6FF"/>
      <stop offset="1" stop-color="#8174F9"/>
    </linearGradient>

    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D5F78B"/>
      <stop offset="1" stop-color="#85DDAA"/>
    </linearGradient>

    <linearGradient id="flowLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#65D5FF" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#65D5FF"/>
      <stop offset="1" stop-color="#B2F18C" stop-opacity=".6"/>
    </linearGradient>

    <radialGradient id="blueGlow">
      <stop stop-color="#338EDB" stop-opacity=".32"/>
      <stop offset="1" stop-color="#338EDB" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow">
      <stop stop-color="#8273FF" stop-opacity=".2"/>
      <stop offset="1" stop-color="#8273FF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#9CBDE0" stroke-opacity=".045"/>
    </pattern>

    <filter id="blur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <style>
      .font {
        font-family: Arial, Helvetica, sans-serif;
      }
      .muted {
        fill: #91A7C2;
        font-family: Arial, Helvetica, sans-serif;
      }
      .small {
        fill: #8EA7C5;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.7px;
      }
      .stage {
        fill: #F0F6FF;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        font-weight: 700;
      }
      .detail {
        fill: #A7BAD2;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11px;
      }
      .tech {
        fill: #DCEBFA;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11px;
        font-weight: 600;
      }
      .node {
        fill: #0D1D30;
        stroke: #2A415D;
        stroke-width: 1;
      }
      .chip {
        fill: #142940;
        stroke: #2C4C69;
        stroke-width: 1;
      }
    </style>
  </defs>

  <!-- FULL-BLEED BACKGROUND: no border, no rounded corners -->
  <rect width="1280" height="700" fill="url(#bg)"/>
  <rect width="1280" height="700" fill="url(#grid)"/>

  <ellipse cx="100" cy="70" rx="290" ry="170"
           fill="url(#blueGlow)" filter="url(#blur)"/>
  <ellipse cx="1170" cy="150" rx="230" ry="170"
           fill="url(#purpleGlow)" filter="url(#blur)"/>
  <ellipse cx="1080" cy="610" rx="220" ry="130"
           fill="url(#blueGlow)" filter="url(#blur)"/>

  <!-- BRAND HEADER -->
  <g id="brand">
    <rect x="44" y="26" width="40" height="40" rx="11"
          fill="#112A43" stroke="#3E7095"/>

    <path d="M54 36H74V41H60V45H71V50H60V57H54Z"
          fill="url(#blue)"/>
    <path d="M66 50H75V57H66Z" fill="url(#lime)"/>

    <text x="96" y="43" class="font"
          font-size="17" font-weight="700"
          fill="#F2F7FF">SaqlainHub</text>

    <text x="96" y="60" class="font"
          font-size="9" font-weight="600" letter-spacing="2"
          fill="#83A7CC">ENGINEERING / AI</text>

    <text x="1236" y="43" text-anchor="end" class="small">
      PERSONAL ENGINEERING PROFILE
    </text>
    <circle cx="1214" cy="59" r="3" fill="#B7EF8A"/>
    <text x="1204" y="63" text-anchor="end"
          class="muted" font-size="11">Build · Integrate · Improve</text>
  </g>

  <line x1="44" y1="82" x2="1236" y2="82"
        stroke="#31465F" stroke-opacity=".8"/>

  <!-- IDENTITY -->
  <g id="identity">


    <text x="640" y="158" text-anchor="middle" class="font"
          font-size="43" font-weight="700" letter-spacing="-1.2"
          fill="#F3F7FF">Saqlain Ahmad</text>

    <text x="640" y="192" text-anchor="middle" class="font"
          font-size="21" font-weight="600">
      <tspan fill="#8BE3FF">Full-Stack Software Engineer</tspan>
      <tspan fill="#6D829D">  &amp;  </tspan>
      <tspan fill="#C4B5FD">AI Engineer</tspan>
    </text>

    <text x="640" y="221" text-anchor="middle" class="font"
          font-size="14" fill="#A9BCD3">
      Building full-stack applications, AI-powered systems &amp; AI Agents in practical life.
    </text>

    <rect x="558" y="239" width="105" height="3" rx="1.5"
          fill="url(#blue)"/>
    <rect x="669" y="239" width="27" height="3" rx="1.5"
          fill="url(#violet)"/>
    <rect x="702" y="239" width="17" height="3" rx="1.5"
          fill="url(#lime)"/>
  </g>



 <!-- WORKFLOW: moved upward 24 units -->
  <g id="workflow-connectors"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M236 389H252 M434 389H450 M632 389H648 M830 389H846 M1028 389H1044"
          stroke="url(#flowLine)" stroke-width="2"/>
    <path d="M246 385L252 389L246 393
             M444 385L450 389L444 393
             M642 385L648 389L642 393
             M840 385L846 389L840 393
             M1038 385L1044 389L1038 393"
          stroke="#83DFFF" stroke-width="1.5"/>
    <circle cx="244" cy="389" r="2.5" fill="#72D8FF"/>
    <circle cx="442" cy="389" r="2.5" fill="#72D8FF"/>
    <circle cx="640" cy="389" r="2.5" fill="#AFA2FF"/>
    <circle cx="838" cy="389" r="2.5" fill="#AFA2FF"/>
    <circle cx="1036" cy="389" r="2.5" fill="#B7EF8A"/>
  </g>

  <!-- STAGE 1: UI/UX -->
  <g id="ui-ux">
    <rect x="54" y="309" width="182" height="100" rx="12" class="node"/>
    <rect x="54" y="309" width="182" height="3" rx="1.5" fill="url(#blue)"/>
    <rect x="72" y="326" width="31" height="27" rx="5"
          fill="#142F48" stroke="#4A8DB5"/>
    <rect x="78" y="332" width="19" height="4" rx="2" fill="#8BE3FF"/>
    <rect x="78" y="340" width="12" height="3" rx="1.5" fill="#6B91B6"/>
    <rect x="78" y="346" width="16" height="3" rx="1.5" fill="#6B91B6"/>
    <text x="72" y="376" class="stage">UI / UX</text>
    <text x="72" y="395" class="detail">Experience &amp; design</text>
  </g>

  <!-- STAGE 2: FRONTEND -->
  <g id="frontend">
    <rect x="252" y="309" width="182" height="100" rx="12" class="node"/>
    <rect x="252" y="309" width="182" height="3" rx="1.5" fill="#58CFFF"/>
    <rect x="270" y="326" width="31" height="27" rx="5"
          fill="#142F48" stroke="#4A8DB5"/>
    <path d="M281 333L276 339L281 345 M291 333L296 339L291 345"
          stroke="#8BE3FF" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="270" y="376" class="stage">Frontend</text>
    <text x="270" y="395" class="detail">Interfaces &amp; interaction</text>
  </g>

  <!-- STAGE 3: BACKEND -->
  <g id="backend">
    <rect x="450" y="309" width="182" height="100" rx="12" class="node"/>
    <rect x="450" y="309" width="182" height="3" rx="1.5" fill="url(#violet)"/>
    <rect x="468" y="326" width="31" height="27" rx="5"
          fill="#262348" stroke="#665AA5"/>
    <path d="M475 334H492 M475 339H492 M475 344H486"
          stroke="#C4B5FD" stroke-width="1.6" stroke-linecap="round"/>
    <text x="468" y="376" class="stage">Backend</text>
    <text x="468" y="395" class="detail">Business logic &amp; APIs</text>
  </g>

  <!-- STAGE 4: DATA -->
  <g id="data-layer">
    <rect x="648" y="309" width="182" height="100" rx="12" class="node"/>
    <rect x="648" y="309" width="182" height="3" rx="1.5" fill="#58D7C7"/>
    <ellipse cx="681" cy="331" rx="12" ry="5"
             fill="#173B3B" stroke="#73E4D3" stroke-width="1.4"/>
    <path d="M669 331V347C669 353 693 353 693 347V331
             M669 339C669 345 693 345 693 339"
          stroke="#73E4D3" stroke-width="1.4"/>
    <text x="666" y="376" class="stage">Data Layer</text>
    <text x="666" y="395" class="detail">Storage &amp; retrieval</text>
  </g>

  <!-- STAGE 5: AI -->
  <g id="ai-layer">
    <rect x="846" y="309" width="182" height="100" rx="12" class="node"/>
    <rect x="846" y="309" width="182" height="3" rx="1.5" fill="url(#violet)"/>
    <circle cx="879" cy="339" r="11"
            fill="#252044" stroke="#BBAAFF" stroke-width="1.4"/>
    <circle cx="879" cy="339" r="3.5" fill="#C7B9FF"/>
    <circle cx="868" cy="330" r="2" fill="#C7B9FF"/>
    <circle cx="890" cy="330" r="2" fill="#C7B9FF"/>
    <circle cx="868" cy="348" r="2" fill="#C7B9FF"/>
    <circle cx="890" cy="348" r="2" fill="#C7B9FF"/>
    <path d="M870 332L876 336 M888 332L882 336 M870 346L876 342 M888 346L882 342"
          stroke="#C7B9FF" stroke-width="1.2"/>
    <text x="864" y="376" class="stage">AI Layer</text>
    <text x="864" y="395" class="detail">Context-aware intelligence</text>
  </g>

  <!-- STAGE 6: PRODUCTION -->
  <g id="production">
    <rect x="1044" y="309" width="182" height="100" rx="12"
          fill="#101F2C" stroke="#47654F"/>
    <rect x="1044" y="309" width="182" height="3" rx="1.5" fill="url(#lime)"/>
    <rect x="1062" y="326" width="31" height="27" rx="5"
          fill="#1A342F" stroke="#62895D"/>
    <path d="M1068 345L1074 339L1079 343L1087 333"
          stroke="#D5F78B" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1087" cy="333" r="2" fill="#D5F78B"/>
    <text x="1062" y="376" class="stage">Production</text>
    <text x="1062" y="395" class="detail">Ship &amp; maintain</text>
  </g>


 <!-- ENGINEERING PRINCIPLE: moved upward 40 units -->
  <g id="principle">
    <rect x="54" y="445" width="1172" height="67" rx="11"
          fill="#0C1B2C" stroke="#2A4058"/>
    <rect x="54" y="445" width="3" height="67" rx="1.5" fill="url(#blue)"/>
    <text x="75" y="470" class="small">THE ENGINEERING PRINCIPLE</text>
    <text x="75" y="495" class="font" font-size="15" font-weight="600">
      <tspan fill="#EAF3FF">Design with intent.</tspan>
      <tspan fill="#8BE3FF">  Build end to end.</tspan>
      <tspan fill="#C4B5FD">  Integrate intelligence.</tspan>
      <tspan fill="#BFEF91">  Deliver value.</tspan>
    </text>
  </g>


 

</svg>
