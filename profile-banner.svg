<svg xmlns="http://www.w3.org/2000/svg"
     width="1280"
     height="700"
     viewBox="0 0 1280 700"
     fill="none">

  <title>SaqlainHub | Full-Stack Software Engineer and AI Engineer</title>
  <desc>Saqlain Ahmad's engineering profile, showcasing full-stack development, data systems, AI engineering, and production deployment.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071321"/>
      <stop offset=".55" stop-color="#0B192B"/>
      <stop offset="1" stop-color="#10182B"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8BE3FF"/>
      <stop offset="1" stop-color="#4599F7"/>
    </linearGradient>

    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C6B6FF"/>
      <stop offset="1" stop-color="#8174F9"/>
    </linearGradient>

    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D5F78B"/>
      <stop offset="1" stop-color="#85DDAA"/>
    </linearGradient>

    <linearGradient id="flowLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#65D5FF" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#65D5FF"/>
      <stop offset="1" stop-color="#B2F18C" stop-opacity=".6"/>
    </linearGradient>

    <radialGradient id="blueGlow">
      <stop stop-color="#338EDB" stop-opacity=".32"/>
      <stop offset="1" stop-color="#338EDB" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow">
      <stop stop-color="#8273FF" stop-opacity=".2"/>
      <stop offset="1" stop-color="#8273FF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#9CBDE0" stroke-opacity=".045"/>
    </pattern>

    <filter id="blur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <style>
      .font {
        font-family: Arial, Helvetica, sans-serif;
      }
      .muted {
        fill: #91A7C2;
        font-family: Arial, Helvetica, sans-serif;
      }
      .small {
        fill: #8EA7C5;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.7px;
      }
      .stage {
        fill: #F0F6FF;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        font-weight: 700;
      }
      .detail {
        fill: #A7BAD2;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11px;
      }
      .tech {
        fill: #DCEBFA;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11px;
        font-weight: 600;
      }
      .node {
        fill: #0D1D30;
        stroke: #2A415D;
        stroke-width: 1;
      }
      .chip {
        fill: #142940;
        stroke: #2C4C69;
        stroke-width: 1;
      }
    </style>
  </defs>

  <!-- FULL-BLEED BACKGROUND: no border, no rounded corners -->
  <rect width="1280" height="700" fill="url(#bg)"/>
  <rect width="1280" height="700" fill="url(#grid)"/>

  <ellipse cx="100" cy="70" rx="290" ry="170"
           fill="url(#blueGlow)" filter="url(#blur)"/>
  <ellipse cx="1170" cy="150" rx="230" ry="170"
           fill="url(#purpleGlow)" filter="url(#blur)"/>
  <ellipse cx="1080" cy="610" rx="220" ry="130"
           fill="url(#blueGlow)" filter="url(#blur)"/>

  <!-- BRAND HEADER -->
  <g id="brand">
    <rect x="44" y="26" width="40" height="40" rx="11"
          fill="#112A43" stroke="#3E7095"/>

    <path d="M54 36H74V41H60V45H71V50H60V57H54Z"
          fill="url(#blue)"/>
    <path d="M66 50H75V57H66Z" fill="url(#lime)"/>

    <text x="96" y="43" class="font"
          font-size="17" font-weight="700"
          fill="#F2F7FF">SaqlainHub</text>

    <text x="96" y="60" class="font"
          font-size="9" font-weight="600" letter-spacing="2"
          fill="#83A7CC">ENGINEERING / AI</text>

    <text x="1236" y="43" text-anchor="end" class="small">
      PERSONAL ENGINEERING PROFILE
    </text>
    <circle cx="1214" cy="59" r="3" fill="#B7EF8A"/>
    <text x="1204" y="63" text-anchor="end"
          class="muted" font-size="11">Build · Integrate · Improve</text>
  </g>

  <line x1="44" y1="82" x2="1236" y2="82"
        stroke="#31465F" stroke-opacity=".8"/>

  <!-- IDENTITY -->
  <g id="identity">
    <text x="640" y="111" text-anchor="middle" class="small">
      SOFTWARE ENGINEERING &amp; INTELLIGENT SYSTEMS
    </text>

    <text x="640" y="158" text-anchor="middle" class="font"
          font-size="43" font-weight="700" letter-spacing="-1.2"
          fill="#F3F7FF">Saqlain Ahmad</text>

    <text x="640" y="192" text-anchor="middle" class="font"
          font-size="21" font-weight="600">
      <tspan fill="#8BE3FF">Full-Stack Software Engineer</tspan>
      <tspan fill="#6D829D">  &amp;  </tspan>
      <tspan fill="#C4B5FD">AI Engineer</tspan>
    </text>

    <text x="640" y="221" text-anchor="middle" class="font"
          font-size="14" fill="#A9BCD3">
      Building useful digital experiences and turning AI capabilities into connected software.
    </text>

    <rect x="578" y="239" width="105" height="3" rx="1.5"
          fill="url(#blue)"/>
    <rect x="689" y="239" width="27" height="3" rx="1.5"
          fill="url(#violet)"/>
    <rect x="722" y="239" width="17" height="3" rx="1.5"
          fill="url(#lime)"/>
  </g>

  <!-- WORKFLOW HEADING -->
  <g id="workflow-heading">
    <text x="54" y="282" class="small">ENGINEERING WORKFLOW</text>
    <text x="54" y="309" class="font"
          font-size="21" font-weight="700"
          fill="#EDF5FF">From interface to production</text>

    <text x="1226" y="300" text-anchor="end"
          class="muted" font-size="11">
      DESIGN → BUILD → INTELLIGENCE → SHIP
    </text>
  </g>

  <!-- WORKFLOW CONNECTIONS -->
  <g id="workflow-connectors"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M236 413H252 M434 413H450 M632 413H648 M830 413H846 M1028 413H1044"
          stroke="url(#flowLine)" stroke-width="2"/>

    <path d="M246 409L252 413L246 417
             M444 409L450 413L444 417
             M642 409L648 413L642 417
             M840 409L846 413L840 417
             M1038 409L1044 413L1038 417"
          stroke="#83DFFF" stroke-width="1.5"/>

    <circle cx="244" cy="413" r="2.5" fill="#72D8FF"/>
    <circle cx="442" cy="413" r="2.5" fill="#72D8FF"/>
    <circle cx="640" cy="413" r="2.5" fill="#AFA2FF"/>
    <circle cx="838" cy="413" r="2.5" fill="#AFA2FF"/>
    <circle cx="1036" cy="413" r="2.5" fill="#B7EF8A"/>
  </g>

  <!-- STAGE 1: UI/UX -->
  <g id="ui-ux">
    <rect x="54" y="333" width="182" height="160" rx="12" class="node"/>
    <rect x="54" y="333" width="182" height="3" rx="1.5" fill="url(#blue)"/>

    <rect x="72" y="350" width="31" height="27" rx="5"
          fill="#142F48" stroke="#4A8DB5"/>
    <rect x="78" y="356" width="19" height="4" rx="2" fill="#8BE3FF"/>
    <rect x="78" y="364" width="12" height="3" rx="1.5" fill="#6B91B6"/>
    <rect x="78" y="370" width="16" height="3" rx="1.5" fill="#6B91B6"/>

    <text x="72" y="400" class="stage">UI / UX</text>
    <text x="72" y="419" class="detail">Experience &amp; design</text>
    <line x1="72" y1="433" x2="218" y2="433" stroke="#2B4058"/>
    <text x="72" y="453" class="tech">Figma · Layout</text>
    <text x="72" y="473" class="detail">User flows · Responsive UI</text>
  </g>

  <!-- STAGE 2: FRONTEND -->
  <g id="frontend">
    <rect x="252" y="333" width="182" height="160" rx="12" class="node"/>
    <rect x="252" y="333" width="182" height="3" rx="1.5" fill="#58CFFF"/>

    <rect x="270" y="350" width="31" height="27" rx="5"
          fill="#142F48" stroke="#4A8DB5"/>
    <path d="M281 357L276 363L281 369 M291 357L296 363L291 369"
          stroke="#8BE3FF" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>

    <text x="270" y="400" class="stage">Frontend</text>
    <text x="270" y="419" class="detail">Interfaces &amp; interaction</text>
    <line x1="270" y1="433" x2="416" y2="433" stroke="#2B4058"/>
    <text x="270" y="453" class="tech">React · Next.js</text>
    <text x="270" y="473" class="detail">TypeScript · Tailwind CSS</text>
  </g>

  <!-- STAGE 3: BACKEND -->
  <g id="backend">
    <rect x="450" y="333" width="182" height="160" rx="12" class="node"/>
    <rect x="450" y="333" width="182" height="3" rx="1.5" fill="url(#violet)"/>

    <rect x="468" y="350" width="31" height="27" rx="5"
          fill="#262348" stroke="#665AA5"/>
    <path d="M475 358H492 M475 363H492 M475 368H486"
          stroke="#C4B5FD" stroke-width="1.6" stroke-linecap="round"/>

    <text x="468" y="400" class="stage">Backend</text>
    <text x="468" y="419" class="detail">Business logic &amp; APIs</text>
    <line x1="468" y1="433" x2="614" y2="433" stroke="#2B4058"/>
    <text x="468" y="453" class="tech">Python · FastAPI</text>
    <text x="468" y="473" class="detail">Auth · REST APIs · Tool calls</text>
  </g>

  <!-- STAGE 4: DATA -->
  <g id="data-layer">
    <rect x="648" y="333" width="182" height="160" rx="12" class="node"/>
    <rect x="648" y="333" width="182" height="3" rx="1.5" fill="#58D7C7"/>

    <ellipse cx="681" cy="355" rx="12" ry="5"
             fill="#173B3B" stroke="#73E4D3" stroke-width="1.4"/>
    <path d="M669 355V371C669 377 693 377 693 371V355
             M669 363C669 369 693 369 693 363"
          stroke="#73E4D3" stroke-width="1.4"/>

    <text x="666" y="400" class="stage">Data Layer</text>
    <text x="666" y="419" class="detail">Storage &amp; retrieval</text>
    <line x1="666" y1="433" x2="812" y2="433" stroke="#2B4058"/>
    <text x="666" y="453" class="tech">PostgreSQL · Neon</text>
    <text x="666" y="473" class="detail">SQLAlchemy · Prisma · Vectors</text>
  </g>

  <!-- STAGE 5: AI -->
  <g id="ai-layer">
    <rect x="846" y="333" width="182" height="160" rx="12" class="node"/>
    <rect x="846" y="333" width="182" height="3" rx="1.5" fill="url(#violet)"/>

    <circle cx="879" cy="363" r="11"
            fill="#252044" stroke="#BBAAFF" stroke-width="1.4"/>
    <circle cx="879" cy="363" r="3.5" fill="#C7B9FF"/>
    <circle cx="868" cy="354" r="2" fill="#C7B9FF"/>
    <circle cx="890" cy="354" r="2" fill="#C7B9FF"/>
    <circle cx="868" cy="372" r="2" fill="#C7B9FF"/>
    <circle cx="890" cy="372" r="2" fill="#C7B9FF"/>
    <path d="M870 356L876 360 M888 356L882 360 M870 370L876 366 M888 370L882 366"
          stroke="#C7B9FF" stroke-width="1.2"/>

    <text x="864" y="400" class="stage">AI Layer</text>
    <text x="864" y="419" class="detail">Context-aware intelligence</text>
    <line x1="864" y1="433" x2="1010" y2="433" stroke="#2B4058"/>
    <text x="864" y="453" class="tech">Gemini · LLM APIs</text>
    <text x="864" y="473" class="detail">RAG · Embeddings · Agents</text>
  </g>

  <!-- STAGE 6: PRODUCTION -->
  <g id="production">
    <rect x="1044" y="333" width="182" height="160" rx="12"
          fill="#101F2C" stroke="#47654F"/>
    <rect x="1044" y="333" width="182" height="3" rx="1.5" fill="url(#lime)"/>

    <rect x="1062" y="350" width="31" height="27" rx="5"
          fill="#1A342F" stroke="#62895D"/>
    <path d="M1068 369L1074 363L1079 367L1087 357"
          stroke="#D5F78B" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1087" cy="357" r="2" fill="#D5F78B"/>

    <text x="1062" y="400" class="stage">Production</text>
    <text x="1062" y="419" class="detail">Ship &amp; maintain</text>
    <line x1="1062" y1="433" x2="1208" y2="433" stroke="#344A42"/>
    <text x="1062" y="453" class="tech">Git · GitHub</text>
    <text x="1062" y="473" class="detail">Deploy · Monitor</text>
  </g>

  <!-- ENGINEERING PRINCIPLE -->
  <g id="principle">
    <rect x="54" y="516" width="1172" height="57" rx="11"
          fill="#0C1B2C" stroke="#2A4058"/>
    <rect x="54" y="516" width="3" height="57" rx="1.5" fill="url(#blue)"/>

    <text x="75" y="537" class="small">THE ENGINEERING PRINCIPLE</text>
    <text x="75" y="558" class="font" font-size="15" font-weight="600">
      <tspan fill="#EAF3FF">Design with intent.</tspan>
      <tspan fill="#8BE3FF">  Build end to end.</tspan>
      <tspan fill="#C4B5FD">  Integrate intelligence.</tspan>
      <tspan fill="#BFEF91">  Deliver value.</tspan>
    </text>
  </g>

  <!-- CORE TOOLKIT -->
  <g id="technology-summary">
    <text x="54" y="603" class="small">CORE TOOLKIT</text>

    <g transform="translate(177 583)">
      <rect width="112" height="30" rx="7" class="chip"/>
      <text x="56" y="19" text-anchor="middle" class="tech">TypeScript</text>
    </g>

    <g transform="translate(297 583)">
      <rect width="96" height="30" rx="7" class="chip"/>
      <text x="48" y="19" text-anchor="middle" class="tech">Next.js</text>
    </g>

    <g transform="translate(401 583)">
      <rect width="85" height="30" rx="7" class="chip"/>
      <text x="42.5" y="19" text-anchor="middle" class="tech">Python</text>
    </g>

    <g transform="translate(494 583)">
      <rect width="98" height="30" rx="7" class="chip"/>
      <text x="49" y="19" text-anchor="middle" class="tech">FastAPI</text>
    </g>

    <g transform="translate(600 583)">
      <rect width="122" height="30" rx="7" class="chip"/>
      <text x="61" y="19" text-anchor="middle" class="tech">PostgreSQL</text>
    </g>

    <g transform="translate(730 583)">
      <rect width="70" height="30" rx="7" class="chip"/>
      <text x="35" y="19" text-anchor="middle" class="tech">RAG</text>
    </g>

    <g transform="translate(808 583)">
      <rect width="105" height="30" rx="7" class="chip"/>
      <text x="52.5" y="19" text-anchor="middle" class="tech">LLM APIs</text>
    </g>

    <g transform="translate(921 583)">
      <rect width="99" height="30" rx="7" class="chip"/>
      <text x="49.5" y="19" text-anchor="middle" class="tech">GitHub</text>
    </g>

    <g transform="translate(1028 583)">
      <rect width="98" height="30" rx="7" class="chip"/>
      <text x="49" y="19" text-anchor="middle" class="tech">Prisma</text>
    </g>

    <g transform="translate(1134 583)">
      <rect width="92" height="30" rx="7" fill="#1D302B" stroke="#47654F"/>
      <text x="46" y="19" text-anchor="middle" class="tech" fill="#D5F78B">Deploy</text>
    </g>
  </g>

  <!-- FOOTER -->
  <line x1="54" y1="641" x2="1226" y2="641" stroke="#2D4057"/>

  <text x="54" y="665" class="font" font-size="10" fill="#8198B5">
    SAQLAINHUB
  </text>

  <text x="640" y="665" text-anchor="middle"
        class="font" font-size="10" fill="#8198B5">
    SOFTWARE ENGINEERING × AI ENGINEERING
  </text>

  <text x="1226" y="665" text-anchor="end"
        class="font" font-size="10" fill="#8198B5">
    BUILDING WITH PURPOSE
  </text>

</svg>
